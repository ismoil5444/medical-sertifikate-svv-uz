<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подтверждение кода</title>
    <style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin-top: 50px;
  background-color: #fff;
}
img.logo {
  width: 100px;
  margin-bottom: 20px;
}
.container {
  max-width: 400px;
  margin: auto;
  padding: 20px;
  border-radius: 8px;
}
input[type="text"] {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  font-size: 16px;
}
button {
  padding: 10px 20px;
  background-color: #2d8cf0;
  color: white;
  font-size: 16px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
.error {
  color: red;
  margin-top: 10px;
}
</style>
</head>
<body>
    <div class="container">
        <img class="logo" src="../images/uzb_emblem.png" alt="Emblem">
        <h3>Министерство здравоохранения<br>Республики Узбекистан</h3>
        <p><strong>Код подтверждения</strong></p>
        <input type="text" id="codeInput" placeholder="Введите код">
        <button onclick="verifyCode()">Подтвердить</button>
        <p id="error" class="error"></p>
        <div id="imageContainer" style="display:none; margin-top:20px;">
            <img src="../images/page3.png" alt="Document" style="width:100%;">
        </div>
    </div>
    <script>
        function verifyCode() {
            const input = document.getElementById('codeInput').value;
            const error = document.getElementById('error');
            const image = document.getElementById('imageContainer');
            if (input === "2768") {
                error.textContent = "";
                image.style.display = "block";
            } else {
                error.textContent = "Неверный код. Повторите попытку.";
                image.style.display = "none";
            }
        }
    </script>
</body>
</html>
